<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contactcss.css">
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Engage With Us</h1>
        <p>We eagerly await the opportunity to address your inquiries and support your journey towards success.
           <br> Please don't hesitate to reach out to us.</p>
        <div class="contact-box">
            <div class="contact-left">
                <h3><u>Sent your request</u></h3>
                <form>
                    <div class="input-row">
                        <div class="input-group">
                            <label>Name</label>
                            <input type="text" placeholder="Enter your Name">
                        </div>
                        <div class="input-group">
                            <label>Phone</label>
                            <input type="text" placeholder="Enter your Phone no.">
                        </div>
                        <div class="input-group">
                            <label>Email</label>
                            <input type="text" placeholder="Enter your Email-ID">
                        </div>
                        <div class="input-group">
                            <label>Subject</label>
                            <input type="text" placeholder="Enter your Subject">
                        </div>
                    </div>
                    <button type="Submit">SEND</button>
                </form>
            </div>
            <div class="contact-right">
                <h3><u>Reach Us</u></h3>
                <table>
                    <tr>
                        <td>Email :</td>
                        <td>100shparul@gmail.com</td>
                    </tr>
                    <tr>
                        <td>Phone :</td>
                        <td>99710XXXXX</td>
                    </tr>
                    <tr>
                        <td>Address :</td>
                        <td>Greater Noida, U.P., 210306</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
